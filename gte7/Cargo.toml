[package]
name = "gte7"
version = "0.1.0"
edition = "2024"
build = "build/main.rs"

[[bin]]
name = "gte7_VC_app"
path = "vc/src/main.rs"
test = false
bench = false

[dependencies]
panic-halt = "0.2"

[build-dependencies]
cc = "1.0"       # To compile the C code
bindgen = "0.72" # To generate Rust FFI bindings from C headers
